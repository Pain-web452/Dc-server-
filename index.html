<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24/7 Messenger Bot</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        body { background-color: #FEE7EC; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #ffffff; width: 100%; max-width: 500px; border-radius: 8px; padding: 25px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05); }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 20px; color: #333; font-weight: 700; }
        .badge { background-color: #FF4A77; color: white; font-size: 10px; padding: 3px 8px; border-radius: 4px; display: inline-block; margin-top: 5px; font-weight: bold; text-transform: uppercase; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; font-weight: bold; color: #333; margin-bottom: 6px; }
        .form-group input[type="text"], .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid #FCD4DC; background-color: #FFFDFE; border-radius: 6px; font-size: 13px; color: #666; outline: none; }
        .form-group textarea { resize: vertical; min-height: 60px; }
        .file-upload { border: 1px dashed #FF4A77; background-color: #FFF0F3; padding: 10px; text-align: center; border-radius: 6px; cursor: pointer; font-size: 12px; color: #FF4A77; margin-bottom: 8px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; color: white; display: flex; justify-content: center; align-items: center; gap: 5px; margin-bottom: 10px; }
        .btn-submit { background-color: #FF1E56; }
        .btn-check { background-color: #2F69FF; }
        .btn-delete { background-color: #FF6262; }
        .btn-update { background-color: #2570ED; margin-top: 10px; }
        .button-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .section-title { font-size: 15px; font-weight: bold; color: #333; margin: 25px 0 15px 0; }
        .terminal { background-color: #111; color: #4AF626; font-family: monospace; padding: 15px; border-radius: 6px; min-height: 120px; font-size: 13px; margin-top: 15px; overflow-y: auto; max-height: 200px; white-space: pre-wrap; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>⚡ 24/7 Messenger Bot ⚡</h1>
        <div class="badge">Developer: Raj Mishra</div>
    </div>
    <form id="botForm">
        <div class="form-group">
            <label>Primary Cookies (Required):</label>
            <textarea id="primaryCookies" placeholder="c_user=...; xs=...;"></textarea>
        </div>
        <div class="form-group">
            <label>Backup Cookies (Optional):</label>
            <textarea id="backupCookies" placeholder="Agar primary fail ho jaye to ye use hogi.."></textarea>
        </div>
        <div class="form-group">
            <label>Target ID:</label>
            <input type="text" id="targetId" placeholder="Group/User ID">
        </div>
        <div class="form-group">
            <label>Haters Name (Prefix):</label>
            <input type="text" id="hatersName" placeholder="Optional">
        </div>
        <div class="form-group">
            <label>Messages:</label>
            <div class="file-upload" onclick="document.getElementById('fileInput').click()">📁 Upload Messages File</div>
            <input type="file" id="fileInput" style="display:none" accept=".txt">
            <textarea id="messages" placeholder="Hello&#10;Test"></textarea>
        </div>
        <div class="form-group">
            <label>Delay (Seconds):</label>
            <input type="text" id="delay" value="10">
        </div>
        <button type="button" class="btn btn-submit" onclick="startTask()">🚀 Start 24/7 Task</button>
    </form>

    <div class="section-title">🔍 Task Control</div>
    <div class="form-group">
        <label>Task ID:</label>
        <input type="text" id="taskId" placeholder="Paste Task ID">
    </div>
    <div class="button-group">
        <button class="btn btn-check" onclick="checkTask()">🔹 Check</button>
        <button class="btn btn-delete" onclick="deleteTask()">🗑️ Delete</button>
    </div>
    <div class="form-group">
        <label>Update Primary Cookies:</label>
        <textarea id="updatePrimary" placeholder="Nayi primary cookies"></textarea>
    </div>
    <div class="form-group">
        <label>Update Backup Cookies:</label>
        <textarea id="updateBackup" placeholder="Nayi backup cookies"></textarea>
    </div>
    <button class="btn btn-update" onclick="updateCookies()">💾 Update Cookies</button>
    <div class="terminal" id="logger">Waiting...</div>
</div>

<script>
    const API_URL = `${window.location.origin}/api`; 

    function log(text) {
        const logger = document.getElementById('logger');
        logger.innerText += `\n[${new Date().toLocaleTimeString()}] ${text}`;
        logger.scrollTop = logger.scrollHeight;
    }

    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files;
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('messages').value = e.target.result;
            log("Messages file loaded.");
        };
        reader.readAsText(file);
    });

    async function startTask() {
        const data = {
            primaryCookies: document.getElementById('primaryCookies').value,
            backupCookies: document.getElementById('backupCookies').value,
            targetId: document.getElementById('targetId').value,
            hatersName: document.getElementById('hatersName').value,
            messages: document.getElementById('messages').value.split('\n').filter(msg => msg.trim() !== ""),
            delay: parseInt(document.getElementById('delay').value) || 10
        };

        if(!data.primaryCookies || !data.targetId || !data.messages.length) {
            return alert("Cookies, Target ID, और Messages भरना ज़रूरी है!");
        }

        log("Starting task on Messenger.com (Please wait up to 30s)...");
        
        try {
            // Render के फ्री सर्वर के लिए टाइमआउट लिमिट हटा दी गई है
            const res = await fetch(`${API_URL}/start`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            
            const result = await res.json();
            
            if(result.error) {
                log(`Server Error: ${result.error}`);
            } else if (result.taskId) {
                log(`Task Active! ID: ${result.taskId}`);
                document.getElementById('taskId').value = result.taskId;
            }
        } catch (err) { 
            // सर्वर बैकग्राउंड में प्रोसेस जारी रखता है, स्टेटस चेक करें
            log("Request handling taking longer than expected. Please use 'Check' button with your ID to verify."); 
        }
    }

    async function checkTask() {
        const taskId = document.getElementById('taskId').value;
        if(!taskId) return alert("Task ID डालें!");
        try {
            const res = await fetch(`${API_URL}/status/${taskId}`);
            const result = await res.json();
            log(`Status: ${result.status} | Sent Messages: ${result.sentCount}`);
        } catch (err) { log("Error fetching status. Verify if server is waking up."); }
    }

    async function deleteTask() {
        const taskId = document.getElementById('taskId').value;
        if(!taskId) return alert("Task ID डालें!");
        try {
            const res = await fetch(`${API_URL}/delete/${taskId}`, { method: 'DELETE' });
            const result = await res.json();
            log(result.message);
        } catch (err) { log("Error stopping task."); }
    }

    async function updateCookies() {
        const taskId = document.getElementById('taskId').value;
        const primary = document.getElementById('updatePrimary').value;
        if(!taskId || !primary) return alert("Task ID और New Cookies डालें!");
        try {
            const res = await fetch(`${API_URL}/update-cookies`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ taskId, primary })
            });
            const result = await res.json();
            log(result.message);
        } catch (err) { log("Error updating cookies."); }
    }
</script>
</body>
</html>
