<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24/7 Messenger Bot</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fff;
            margin: 0;
            padding: 10px;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 15px;
            border: 1px solid #f9dbe7;
            border-radius: 8px;
            background-color: #fff;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input[type="text"], input[type="number"], textarea {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            background-color: #fff;
        }
        .file-upload {
            border: 2px dashed #ccc;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            background-color: #fafafa;
        }
        .btn-submit {
            width: 100%;
            background-color: #ff2a74;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }
        .task-control-box {
            margin-top: 30px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        .task-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .btn-details {
            flex: 1;
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-stop {
            flex: 1;
            background-color: #ff1744;
            color: white;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Delay Field -->
    <div class="form-group">
        <label for="delay">Delay (Seconds):</label>
        <input type="number" id="delay" value="10">
    </div>

    <!-- Target UID / Thread ID -->
    <div class="form-group">
        <label for="target-id">Target UID / Thread ID:</label>
        <input type="text" id="target-id" placeholder="Enter FB Target ID">
    </div>

    <!-- Upload Message File -->
    <div class="form-group">
        <label>Upload Message File (.txt):</label>
        <div class="file-upload">
            <input type="file" id="message-file" accept=".txt">
        </div>
    </div>

    <!-- NEW FIELD: Haters Name Code (Messages Preview Box Automatically Removed) -->
    <div class="form-group">
        <label for="haters-name">Haters Name Code:</label>
        <input type="text" id="haters-name" placeholder="Enter Haters Name Code here...">
    </div>

    <!-- Start Button -->
    <button class="btn-submit">🚀 Start Public Bot</button>

    <!-- Task Control Section -->
    <div class="task-control-box">
        <div class="task-title">🔍 Task Control</div>
        
        <div class="form-group">
            <label for="task-id">Task ID:</label>
            <input type="text" id="task-id" placeholder="Enter Task ID">
        </div>

        <div class="btn-group">
            <button class="btn-details">Get Details</button>
            <button class="btn-stop">❌ Stop Task</button>
        </div>
    </div>

    <!-- Primary Cookies -->
    <div class="form-group" style="margin-top: 25px;">
        <label for="cookies">Primary Cookies:</label>
        <textarea id="cookies" placeholder="Paste FB cookies here..."></textarea>
    </div>

</div>

</body>
</html>
