<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24/7 Messenger Bot</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #ffebee; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; background: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #555; }
        textarea, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        textarea { height: 80px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 4px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; color: white; }
        .btn-danger { background-color: #ff1744; }
        .btn-secondary { background-color: #ff5252; }
        .console { background-color: #111; color: #00ff00; font-family: monospace; padding: 15px; border-radius: 4px; height: 150px; overflow-y: auto; margin-top: 15px; white-space: pre-wrap; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <h2>24/7 Messenger Bot</h2>
    
    <div class="form-group">
        <label>Primary Cookies (messenger.com):</label>
        <textarea id="primaryCookies" placeholder="c_user=...; xs=...;"></textarea>
    </div>

    <div class="form-group">
        <label>Target ID (User/Group ID):</label>
        <input type="text" id="targetId" placeholder="1000xxxxxxxxx">
    </div>

    <div class="form-group">
        <label>Messages (One per line):</label>
        <textarea id="messagesText" placeholder="Hello&#10;How are you?"></textarea>
    </div>

    <div class="form-group">
        <label>Delay (Seconds):</label>
        <input type="number" id="delayInput" value="10">
    </div>

    <button class="btn btn-danger" onclick="startTask()">🚀 Start 24/7 Task</button>
    
    <div style="margin-top:20px; border-top: 1px solid #ccc; padding-top:10px;">
        <label>Task ID to Stop:</label>
        <input type="text" id="controlTaskId" placeholder="Task ID clear karne ke liye">
        <button class="btn btn-secondary" onclick="stopTask()">🛑 Stop Task</button>
    </div>

    <div class="console" id="logConsole">Waiting for action...</div>
</div>

<script>
    const BACKEND_URL = "https://onrender.com";
    let currentTaskId = "";

    function log(msg, color = "#00ff00") {
        const consoleEl = document.getElementById('logConsole');
        consoleEl.innerHTML += `<div style="color: ${color}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
        consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    async function startTask() {
        currentTaskId = "task_" + Math.random().toString(36).substr(2, 9);
        document.getElementById('controlTaskId').value = currentTaskId;
        
        log("Sending credentials to Render API server...");

        try {
            const res = await fetch(`${BACKEND_URL}/api/start-task`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    taskId: currentTaskId,
                    primaryCookies: document.getElementById('primaryCookies').value,
                    targetId: document.getElementById('targetId').value,
                    messages: document.getElementById('messagesText').value,
                    delay: document.getElementById('delayInput').value
                })
            });
            const data = await res.json();
            if(data.success) {
                log(`Task successfully started! ID: ${currentTaskId}`, "#00e676");
                log(`Bot running 24/7 in Render Background.`, "#00e676");
            } else {
                log(`Error: ${data.error}`, "#ff5252");
            }
        } catch (e) {
            log("Network Error: Render server is sleeping or updating.", "#ff5252");
        }
    }

    async function stopTask() {
        const id = document.getElementById('controlTaskId').value;
        try {
            const res = await fetch(`${BACKEND_URL}/api/delete-task`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ taskId: id })
            });
            const data = await res.json();
            log(data.message || data.error, "#ff5252");
        } catch(e) { log("Error stopping task.", "#ff5252"); }
    }
</script>
</body>
</html>
